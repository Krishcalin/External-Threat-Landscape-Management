# SKOPOS local stack: db-1 and app-1.
#
# `name:` fixes the compose project, so the containers are `skopos-db-1` and
# `skopos-app-1` rather than being named after whatever the checkout directory
# happens to be called.

name: skopos

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: skopos
      POSTGRES_USER: skopos
      # No default. An unset password here fails the stack at startup, which is
      # the correct outcome — a compose file with a fallback password is how
      # dev credentials reach production.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Postgres trusts any local connection by default; scram is what makes the
      # password above actually load-bearing.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      # Loopback only. Binding 0.0.0.0 would put the database on every interface
      # of the laptop, including whatever network it joins next.
      - "127.0.0.1:55443:5432"
    volumes:
      - skopos-db:/var/lib/postgresql/data
      # Runs once, on an empty data directory. Re-running the schema on an
      # existing volume is the migration story, not this.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skopos -d skopos"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The MIGRATION identity: superuser, owns the tables, bypasses RLS.
      SKOPOS_DATABASE_URL: postgresql://skopos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/skopos
      # The RUNTIME identity. Every store prefers this, and it is the whole
      # reason the row-level security in migration 006 is enforcement rather
      # than decoration: skopos_app is not superuser, has no BYPASSRLS, and
      # owns nothing. Unset it and the stores fall back to the superuser above,
      # where RLS does not apply at all — /api/v1/tenancy reports which one you
      # are actually running.
      SKOPOS_APP_DATABASE_URL: ${SKOPOS_APP_DATABASE_URL:-}
      # Sets skopos_app's password on startup, after migrations apply. Kept out
      # of db/*.sql because a password in a migration is a password in the repo.
      SKOPOS_APP_PASSWORD: ${SKOPOS_APP_PASSWORD:-}
      SKOPOS_ORG_ID: ${SKOPOS_ORG_ID:-default}
      # The FIRST administrator, applied once against an empty user table and
      # ignored thereafter. There is no default credential: admin/admin is a
      # published credential on every install that forgets to change it, and an
      # auto-generated one printed to stdout lands in logs that are aggregated,
      # shipped and retained.
      #
      # Until one exists the console is OPEN and says so on /health and across
      # the top of every page. Authentication enforces itself the moment a user
      # is created.
      # Seals the between-factors token. MUST be set when more than one
      # replica serves traffic, or a login started on one pod cannot be
      # completed on another. Unset is fine for a single container: a fresh
      # per-process secret just invalidates half-finished logins on restart.
      SKOPOS_PENDING_SECRET: ${SKOPOS_PENDING_SECRET:-}
      SKOPOS_BOOTSTRAP_USER: ${SKOPOS_BOOTSTRAP_USER:-}
      SKOPOS_BOOTSTRAP_PASSWORD: ${SKOPOS_BOOTSTRAP_PASSWORD:-}
      # Licensed sources. Each is inert until set; a lookup without one reports
      # it as unavailable rather than returning a clean result.
      SKOPOS_SHODAN_API_KEY: ${SKOPOS_SHODAN_API_KEY:-}
      SKOPOS_VIRUSTOTAL_API_KEY: ${SKOPOS_VIRUSTOTAL_API_KEY:-}
      SKOPOS_HIBP_API_KEY: ${SKOPOS_HIBP_API_KEY:-}
      SKOPOS_CONSOLE_DIR: /app/frontend/dist
      # Unset by default, and that is the safe state: without it the takeover
      # route and the TAXII server are NOT REGISTERED AT ALL. Both serve
      # finished reconnaissance against the estate they describe, so an unset
      # token must not leave them open, and a 401 that can be probed is still
      # an admission the data exists.
      SKOPOS_API_TOKEN: ${SKOPOS_API_TOKEN:-}
      # Alert delivery. Unset means alerts are computed and not delivered,
      # which the /api/v1/alerts response states rather than leaving to be
      # discovered.
      SKOPOS_ALERT_WEBHOOK: ${SKOPOS_ALERT_WEBHOOK:-}
      SKOPOS_ALERT_EMAIL: ${SKOPOS_ALERT_EMAIL:-}
      SKOPOS_SMTP_HOST: ${SKOPOS_SMTP_HOST:-}
      SKOPOS_SMTP_PORT: ${SKOPOS_SMTP_PORT:-587}
      SKOPOS_SMTP_FROM: ${SKOPOS_SMTP_FROM:-}
      SKOPOS_SMTP_USER: ${SKOPOS_SMTP_USER:-}
      SKOPOS_SMTP_PASSWORD: ${SKOPOS_SMTP_PASSWORD:-}
      # Whether a scan run delivers its alerts. Off by default: a scan is
      # already an action somebody took, but sending findings to a third party
      # is a second act and it needs its own consent.
      SKOPOS_ALERT_ON_SCAN: ${SKOPOS_ALERT_ON_SCAN:-}
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      db:
        # Not just "started": the app opens a pool at boot, and a race against
        # an initialising Postgres is a restart loop that looks like a bug.
        condition: service_healthy
    restart: unless-stopped

  # ── opt-in ────────────────────────────────────────────────────────────────
  # Started only by `docker compose --profile scheduler up -d`.
  #
  # OFF BY DEFAULT ON PURPOSE. This service makes outbound requests to FIRST
  # every day, unattended. A stack that began phoning out because somebody ran
  # `docker compose up` would be making an egress decision on the operator's
  # behalf, which is the one thing the gate in this product exists to prevent.
  #
  # The cost of leaving it off is real and worth stating: EPSS publishes today's
  # scores and never republishes yesterday's, so every day this does not run is
  # a permanent hole in every velocity figure computed afterwards, and a
  # forecast that never resolves can never be scored.
  scheduler:
    profiles: ["scheduler"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SKOPOS_DATABASE_URL: postgresql://skopos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/skopos
      # The same unprivileged runtime identity the app uses. Without it these
      # jobs would connect as the superuser, bypass RLS, and resolve_forecasts
      # would work across every tenant's forecasts at once — correct-looking on
      # a single-tenant install and wrong the moment there are two.
      SKOPOS_APP_DATABASE_URL: ${SKOPOS_APP_DATABASE_URL:-}
      SKOPOS_ORG_ID: ${SKOPOS_ORG_ID:-default}
      # Override to run more often when verifying the wiring. The default is a
      # day because that is the publication cadence of the data.
      SKOPOS_SCHEDULE_SECONDS: ${SKOPOS_SCHEDULE_SECONDS:-86400}
      # The estate to re-scan unattended. UNSET MEANS NO SCAN — the scheduler
      # keeps the forecast record alive either way, but run-over-run diff,
      # alerting and ticketing only fire when something re-scans.
      #
      # Delivery is NOT switched on by this. Running a scan describes your
      # estate to yourself; alerting and ticketing describe it to somebody else
      # and keep their own consent (SKOPOS_ALERT_ON_SCAN, SKOPOS_ITSM_ON_SCAN).
      SKOPOS_SCAN_INVENTORY: ${SKOPOS_SCAN_INVENTORY:-}
      SKOPOS_SCAN_OVERWATCH_GRAPH: ${SKOPOS_SCAN_OVERWATCH_GRAPH:-}
      SKOPOS_SCAN_ACTOR: ${SKOPOS_SCAN_ACTOR:-scheduled-scan}
    entrypoint: ["/bin/sh", "tools/daily.sh"]
    # The image's healthcheck probes the HTTP API, which this service does not
    # serve — inherited unchanged it marks the scheduler permanently unhealthy,
    # which is both untrue and the kind of red status an operator learns to
    # ignore. Liveness here is the process: if the loop dies, restart handles it.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skopos-db:
